<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuel Engine</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111318;
            --card-border: #1F242D;
            --text-main: #FFFFFF;
            --text-muted: #8A94A6;
            --accent-green: #00E676;
            --accent-blue: #0066FF;
            --accent-orange: #FF3D00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px 16px 100px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* En-tête Global */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-top: 6px;
        }
        .date-pill {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .date-pill span { color: var(--accent-green); }
        .profile-icon {
            width: 32px; height: 32px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; color: var(--text-muted);
        }

        /* --- SYSTÈME DE VUES (SPA) --- */
        .view-section {
            display: none; /* Caché par défaut */
            animation: fadeIn 0.4s ease;
        }
        .view-section.active {
            display: block; /* Affiché si actif */
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Composants de base (Cartes, Boutons) */
        .whoop-module {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 12px;
        }
        .module-label {
            font-size: 10px; letter-spacing: 1.5px; color: var(--text-muted);
            text-transform: uppercase; margin-bottom: 6px; font-weight: 600;
        }
        .module-data { font-size: 32px; font-weight: 700; letter-spacing: -1px; }
        .module-data span { font-size: 14px; color: var(--text-muted); font-weight: 400; }
        
        .action-btn {
            background-color: var(--accent-green); color: #000;
            border: none; width: 100%; padding: 18px; border-radius: 16px;
            font-size: 13px; font-weight: 800; letter-spacing: 1.5px;
            text-transform: uppercase; cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 230, 118, 0.2);
            margin-top: 12px; display: block; text-align: center;
        }

        /* Composants Photo/Input natifs */
        .camera-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            border: 2px dashed var(--card-border);
            border-radius: 18px;
            margin-top: 20px;
        }
        .camera-wrapper label {
            background-color: var(--card-bg);
            color: var(--accent-green);
            padding: 12px 24px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border: 1px solid var(--accent-green);
        }
        input[type="file"], input[type="text"] {
            display: none; /* On cache le bouton moche par défaut */
        }
        .textarea-custom {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 16px;
            border-radius: 12px;
            min-height: 100px;
            margin-top: 20px;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        /* Navigation Basse */
        nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: #0A0C10; border-top: 1px solid #1A212D;
            display: flex; justify-content: space-around;
            padding: 16px 0 24px 0; z-index: 100;
        }
        .nav-link {
            text-align: center; color: #555E6D; font-size: 9px;
            letter-spacing: 1px; text-transform: uppercase; font-weight: 700;
            display: flex; flex-direction: column; gap: 4px; align-items: center;
        }
        .nav-link.active { color: var(--accent-green); }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="profile-icon">ME</div>
        <div class="date-pill">AUJOURD'HUI <span>●</span></div>
        <div class="profile-icon">⚡</div>
    </div>

    <!-- VUE 1 : ACCUEIL -->
    <div id="view-accueil" class="view-section active">
        <div class="whoop-module" style="text-align: center;">
            <div class="module-label">Score de Nutrition</div>
            <div class="module-data" style="color: var(--accent-green);">85 <span>%</span></div>
        </div>
        <div class="whoop-module">
            <div class="module-label">Calories Restantes</div>
            <div class="module-data">1,240 <span>kcal</span></div>
        </div>
        <button class="action-btn">Scanner un repas</button>
    </div>

    <!-- VUE 2 : ANALYSES -->
    <div id="view-analyses" class="view-section">
        <div class="whoop-module">
            <div class="module-label">Répartition Macros</div>
            <p style="color: var(--text-muted); font-size: 13px; margin-top: 10px;">(Graphiques détaillés à venir ici)</p>
        </div>
    </div>

    <!-- VUE 3 : JOURNAL (Appareil photo & Notes) -->
    <div id="view-journal" class="view-section">
        <div class="whoop-module">
            <div class="module-label">Nouveau Repas</div>
            
            <!-- Accès natif à l'appareil photo du téléphone -->
            <div class="camera-wrapper">
                <label for="camera-input">📸 Prendre en photo</label>
                <input type="file" id="camera-input" accept="image/*" capture="environment">
            </div>

            <!-- Saisie de texte native -->
            <textarea class="textarea-custom" placeholder="Décrivez votre repas ou vos sensations..."></textarea>
            
            <button class="action-btn" style="margin-top: 20px;">Enregistrer l'entrée</button>
        </div>
    </div>

    <!-- VUE 4 : PROFIL -->
    <div id="view-profil" class="view-section">
        <div class="whoop-module">
            <div class="module-label">Paramètres</div>
            <p style="color: var(--text-muted); font-size: 13px; margin-top: 10px;">Réglage des objectifs, âge, poids, etc.</p>
        </div>
    </div>

    <!-- BARRE DE NAVIGATION (Contrôle le système de vues) -->
    <nav id="bottom-nav">
        <div class="nav-link active" data-target="view-accueil">Accueil</div>
        <div class="nav-link" data-target="view-analyses">Analyses</div>
        <div class="nav-link" data-target="view-journal">Journal</div>
        <div class="nav-link" data-target="view-profil">Profil</div>
    </nav>

    <script>
        // Système de navigation Single Page Application (SPA)
        const navLinks = document.querySelectorAll('.nav-link');
        const views = document.querySelectorAll('.view-section');

        navLinks.forEach(link => {
            link.addEventListener('click', () => {
                // 1. Retirer la classe active de tous les boutons
                navLinks.forEach(nav => nav.classList.remove('active'));
                // 2. Ajouter la classe active au bouton cliqué
                link.classList.add('active');

                // 3. Cacher toutes les vues
                views.forEach(view => view.classList.remove('active'));
                
                // 4. Afficher la vue ciblée (grâce à l'attribut data-target)
                const targetId = link.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        // Feedback visuel quand on prend une photo
        document.getElementById('camera-input').addEventListener('change', function(e) {
            if(e.target.files.length > 0) {
                alert("Photo capturée ! (Nous ajouterons la logique d'analyse bientôt)");
            }
        });
    </script>
</body>
</html>
