<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuel Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            padding: 16px 16px 90px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            letter-spacing: 2px;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 24px;
            padding-top: 8px;
        }
        header span {
            color: #00E676;
            font-weight: 700;
        }

        /* Rings Section */
        .rings-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 24px;
        }
        .ring-card {
            background-color: #111418;
            border: 1px solid #1E232A;
            border-radius: 16px;
            flex: 1;
            padding: 14px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ring-wrapper {
            position: relative;
            width: 65px;
            height: 65px;
            margin-bottom: 10px;
        }
        .ring-wrapper svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        .ring-wrapper circle {
            fill: none;
            stroke-width: 5;
        }
        .ring-bg { stroke: #222B35; }
        .ring-fill { stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
        
        .ring-content {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
        }
        .ring-label {
            font-size: 10px;
            letter-spacing: 1px;
            color: #888888;
            text-transform: uppercase;
        }

        /* Cards */
        .whoop-card {
            background-color: #111418;
            border: 1px solid #1E232A;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .card-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .card-value span {
            font-size: 14px;
            color: #888888;
            font-weight: 400;
        }

        /* Action Button */
        .btn-scan {
            background-color: #00E676;
            color: #000000;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.15);
            margin-top: 10px;
        }

        /* Bottom Nav Bar */
        nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background-color: #0A0D10;
            border-top: 1px solid #1A2129;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 24px 0;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #666D78;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
        }
        .nav-item.active {
            color: #00E676;
        }
    </style>
</head>
<body>

    <header>
        <div>Fuel Engine</div>
        <span id="streak-badge">11 %</span>
    </header>

    <!-- Anneaux de progression (Style Whoop) -->
    <div class="rings-container">
        <!-- Protéines -->
        <div class="ring-card">
            <div class="ring-wrapper">
                <svg viewBox="0 0 36 36">
                    <circle class="ring-bg" cx="18" cy="18" r="15.9155"></circle>
                    <circle class="ring-fill" id="prot-circle" cx="18" cy="18" r="15.9155" stroke="#0066FF" stroke-dasharray="100" stroke-dashoffset="30"></circle>
                </svg>
                <div class="ring-content" id="prot-pct">78%</div>
            </div>
            <div class="ring-label">Protéines</div>
        </div>

        <!-- Glucides -->
        <div class="ring-card">
            <div class="ring-wrapper">
                <svg viewBox="0 0 36 36">
                    <circle class="ring-bg" cx="18" cy="18" r="15.9155"></circle>
                    <circle class="ring-fill" id="carbs-circle" cx="18" cy="18" r="15.9155" stroke="#00E676" stroke-dasharray="100" stroke-dashoffset="20"></circle>
                </svg>
                <div class="ring-content" id="carbs-pct">84%</div>
            </div>
            <div class="ring-label">Glucides</div>
        </div>

        <!-- Lipides -->
        <div class="ring-card">
            <div class="ring-wrapper">
                <svg viewBox="0 0 36 36">
                    <circle class="ring-bg" cx="18" cy="18" r="15.9155"></circle>
                    <circle class="ring-fill" id="fats-circle" cx="18" cy="18" r="15.9155" stroke="#FF3D00" stroke-dasharray="100" stroke-dashoffset="25"></circle>
                </svg>
                <div class="ring-content" id="fats-pct">78%</div>
            </div>
            <div class="ring-label">Lipides</div>
        </div>
    </div>

    <!-- Bloc Calories Restantes -->
    <div class="whoop-card">
        <div>
            <div class="card-title">Calories restantes</div>
            <div class="card-value" id="cal-val">1,850 <span>kcal</span></div>
        </div>
    </div>

    <!-- Bouton d'action -->
    <button class="btn-scan" id="scan-btn">Ajouter un repas</button>

    <!-- Barre de navigation basse -->
    <nav>
        <a href="#" class="nav-item active">Accueil</a>
        <a href="#" class="nav-item">Macros</a>
        <a href="#" class="nav-item">Journal</a>
        <a href="#" class="nav-item">Profil</a>
    </nav>

    <script>
        let data = JSON.parse(localStorage.getItem('fuel_data_v2')) || {
            calories: 1850,
            prot: 140,
            carbs: 210,
            fats: 55
        };

        const targets = { prot: 180, carbs: 250, fats: 70 };

        function updateUI() {
            document.getElementById('cal-val').innerHTML = `${data.calories.toLocaleString()} <span>kcal</span>`;

            // Calcul des pourcentages pour les cercles (dashoffset va de 100 à 0)
            let protPct = Math.min(100, Math.round((data.prot / targets.prot) * 100));
            let carbsPct = Math.min(100, Math.round((data.carbs / targets.carbs) * 100));
            let fatsPct = Math.min(100, Math.round((data.fats / targets.fats) * 100));

            document.getElementById('prot-pct').innerText = protPct + '%';
            document.getElementById('carbs-pct').innerText = carbsPct + '%';
            document.getElementById('fats-pct').innerText = fatsPct + '%';

            document.getElementById('prot-circle').style.strokeDashoffset = 100 - protPct;
            document.getElementById('carbs-circle').style.strokeDashoffset = 100 - carbsPct;
            document.getElementById('fats-circle').style.strokeDashoffset = 100 - fatsPct;

            localStorage.setItem('fuel_data_v2', JSON.stringify(data));
        }

        document.getElementById('scan-btn').addEventListener('click', () => {
            let addedCal = prompt("Calories consommées :", "500");
            if (addedCal !== null) {
                data.calories -= parseInt(addedCal || 0);
                data.prot += 30;
                data.carbs += 45;
                data.fats += 12;
                updateUI();
            }
        });

        updateUI();
    </script>
</body>
</html>
