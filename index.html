<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuel Engine - Accueil</title>
    <style>
        /* ============================================================
           NOUVELLE DIRECTION ARTISTIQUE — palette
        ============================================================ */
        :root {
            --bg-app: #000000;
            --text-primary: #FFFFFF;
            --text-secondary: #9E9E9E;
            --color-accent: #76FF03;
            --card-bg: #212121;
            --border-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ============================================================
           STRUCTURE & CENTRAGE RIGOUREUX
        ============================================================ */
        body, #app-root {
            background-color: var(--bg-app);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
        }

        .accueil-screen {
            width: 100%;
            max-width: 430px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-app);
            position: relative;
        }

        /* Barre du haut : conservée sobre, alignée sur la nouvelle palette */
        .top-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 20px 0 20px;
        }
        .date-pill {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .date-pill span { color: var(--color-accent); }

        /* Zone de contenu scrollable sous le score */
        .screen-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 24px 20px;
        }

        /* ============================================================
           ENERGY SCORE — anneau de progression parfaitement centré
        ============================================================ */
        .score-display-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 40px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .score-display-wrapper svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .progress-ring-track {
            fill: none;
            stroke: var(--card-bg);
            stroke-width: 12;
        }

        .progress-ring-circle {
            fill: none;
            stroke: var(--color-accent);
            stroke-width: 12;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .energy-score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .energy-score-value .value {
            font-size: 64px;
            font-weight: 800;
            color: var(--color-accent);
            line-height: 1;
        }
        .energy-score-value .unit {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-accent);
            margin-top: 2px;
        }
        .score-caption {
            text-align: center;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            font-weight: 700;
            margin-top: -24px;
            margin-bottom: 8px;
        }

        /* ============================================================
           CARDS — macros + données brutes
        ============================================================ */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 0;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 16px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .cards-grid .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 0;
            padding: 16px 8px;
        }

        .card-icon {
            stroke: var(--color-accent);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            width: 22px;
            height: 22px;
            margin-bottom: 8px;
        }

        .card-title {
            color: var(--text-primary);
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-value {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 800;
        }

        .card-label {
            color: var(--text-secondary);
            font-size: 9px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Card standard (bloc "Données brutes") */
        .card-full { margin-top: 16px; }
        .card-full .card-title {
            margin-bottom: 12px;
        }
        .raw-data-row {
            display: flex; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid var(--border-color);
        }
        .raw-data-row:last-child { border-bottom: none; }
        .raw-data-row .card-label { color: var(--text-secondary); font-size: 12px; text-transform: none; letter-spacing: 0; font-weight: 500; }
        .raw-data-row .card-value { font-size: 13px; }

        /* ============================================================
           BOUTON SCANNER
        ============================================================ */
        .btn-scanner {
            background-color: var(--text-primary);
            color: var(--bg-app);
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            text-align: center;
            border: none;
            font-size: 12px;
            letter-spacing: 1.5px;
            cursor: pointer;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* ============================================================
           NAVIGATION BASSE
        ============================================================ */
        .bottom-nav {
            background-color: var(--bg-app);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 14px 0 20px 0;
            flex-shrink: 0;
        }

        .nav-icon {
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
        }
        .nav-icon svg {
            width: 20px; height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-icon.active { color: var(--color-accent); }

        /* ============================================================
           LOADER — splash de chargement, parfaitement centré
        ============================================================ */
        .loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-app);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .loader-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-spinner {
            border: 4px solid var(--card-bg);
            border-top: 4px solid var(--color-accent);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Loader de chargement, centré via top:50%/left:50%/translate -->
    <div class="loader-overlay" id="loader-overlay">
        <div class="loader-spinner"></div>
    </div>

    <div id="app-root">
        <div class="accueil-screen">

            <div class="top-bar">
                <div class="date-pill">AUJOURD'HUI <span>●</span></div>
            </div>

            <div class="screen-content">

                <!-- Energy Score : anneau de progression rigoureusement centré -->
                <div class="score-display-wrapper">
                    <svg viewBox="0 0 200 200">
                        <circle class="progress-ring-track" cx="100" cy="100" r="88"></circle>
                        <circle class="progress-ring-circle" cx="100" cy="100" r="88"
                                stroke-dasharray="552.9"
                                stroke-dashoffset="66.3"></circle>
                    </svg>
                    <div class="energy-score-value">
                        <span class="value">88</span>
                        <span class="unit">% ÉNERGIE</span>
                    </div>
                </div>
                <div class="score-caption">Score Énergie du Jour</div>

                <!-- Macros -->
                <div class="cards-grid">
                    <div class="card">
                        <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 2v20M5 8h14M5 16h14"></path></svg>
                        <div class="card-title">Protéines</div>
                        <div class="card-value">130g</div>
                        <div class="card-label">/ 150g</div>
                    </div>
                    <div class="card">
                        <svg class="card-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3"></path></svg>
                        <div class="card-title">Glucides</div>
                        <div class="card-value">190g</div>
                        <div class="card-label">/ 220g</div>
                    </div>
                    <div class="card">
                        <svg class="card-icon" viewBox="0 0 24 24"><path d="M12 3c4 4 6 7 6 10a6 6 0 1 1-12 0c0-3 2-6 6-10z"></path></svg>
                        <div class="card-title">Lipides</div>
                        <div class="card-value">55g</div>
                        <div class="card-label">/ 70g</div>
                    </div>
                </div>

                <!-- Bouton scanner -->
                <button class="btn-scanner" style="margin-top:16px;" onclick="alert('Ouverture de l\'appareil photo + bloc commentaire IA')">
                    📷 Scanner un repas
                </button>

                <!-- Données brutes -->
                <div class="card card-full">
                    <div class="card-title">Données Brutes & Historique</div>
                    <div class="raw-data-row"><span class="card-label">Calories totales</span><span class="card-value">2,140 kcal</span></div>
                    <div class="raw-data-row"><span class="card-label">Eau consommée</span><span class="card-value">2.4 L</span></div>
                    <div class="raw-data-row"><span class="card-label">Repas enregistrés</span><span class="card-value">3 / 4</span></div>
                    <div class="raw-data-row"><span class="card-label">Index glycémique moyen</span><span class="card-value">Bas</span></div>
                </div>

            </div>

            <!-- Navigation basse -->
            <nav class="bottom-nav">
                <div class="nav-icon active">
                    <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"></path><path d="M5 10v10h14V10"></path></svg>
                    Accueil
                </div>
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 1 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"></path></svg>
                    Santé
                </div>
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9 10h.01M15 10h.01M9 15c.83.67 1.87 1 3 1s2.17-.33 3-1"></path></svg>
                    Coach IA
                </div>
                <div class="nav-icon">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
                    Profil
                </div>
            </nav>

        </div>
    </div>

    <script>
        // Masque le loader une fois le contenu prêt
        window.addEventListener('load', function () {
            setTimeout(function () {
                document.getElementById('loader-overlay').classList.add('hidden');
            }, 900);
        });
    </script>
</body>
</html>
