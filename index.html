<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuel Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            padding: 16px 16px 90px 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            letter-spacing: 2px;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 24px;
            padding-top: 8px;
        }
        header span {
            color: #00E676;
            font-weight: 700;
            cursor: pointer;
        }

        /* Rings Section */
        .rings-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 24px;
        }
        .ring-card {
            background-color: #111418;
            border: 1px solid #1E232A;
            border-radius: 16px;
            flex: 1;
            padding: 14px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ring-wrapper {
            position: relative;
            width: 65px;
            height: 65px;
            margin-bottom: 10px;
        }
        .ring-wrapper svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }
        .ring-wrapper circle {
            fill: none;
            stroke-width: 5;
        }
        .ring-bg { stroke: #222B35; }
        .ring-fill { stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
        
        .ring-content {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
        }
        .ring-label {
            font-size: 10px;
            letter-spacing: 1px;
            color: #888888;
            text-transform: uppercase;
        }

        /* Cards */
        .whoop-card {
            background-color: #111418;
            border: 1px solid #1E232A;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-title {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .card-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .card-value span {
            font-size: 14px;
            color: #888888;
            font-weight: 400;
        }

        /* Action Buttons */
        .btn-scan {
            background-color: #00E676;
            color: #000000;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.15);
            margin-top: 10px;
        }
        .btn-reset {
            background-color: transparent;
            color: #FF3D00;
            border: 1px solid #3A1711;
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 200;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-content {
            background-color: #111418;
            border: 1px solid #1E232A;
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 500px;
            padding: 24px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .modal-title {
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #888888;
            margin-bottom: 20px;
            text-align: center;
        }
        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888888;
            margin-bottom: 6px;
        }
        .input-group input {
            width: 100%;
            background-color: #0A0D10;
            border: 1px solid #222B35;
            border-radius: 10px;
            padding: 12px;
            color: #FFF;
            font-size: 16px;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-modal-save {
            background-color: #00E676;
            color: #000;
            border: none;
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .btn-modal-cancel {
            background-color: #222B35;
            color: #FFF;
            border: none;
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        /* Bottom Nav Bar */
        nav {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background-color: #0A0D10;
            border-top: 1px solid #1A2129;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 24px 0;
            z-index: 100;
        }
        .nav-item {
            text-align: center;
            color: #666D78;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
        }
        .nav-item.active {
            color: #00E676;
        }
    </style>
</head>
<body>

    <header>
        <div>Fuel Engine</div>
        <span id="reset-day">Réinitialiser</span>
    </header>

    <!-- Anneaux de progression -->
    <div class="rings-container">
        <!-- Protéines -->
        <div class="ring-card">
            <div class="ring-wrapper">
                <svg viewBox="0 0 36 36">
                    <circle class="ring-bg" cx="18" cy="18" r="15.9155"></circle>
                    <circle class="ring-fill" id="prot-circle" cx="18" cy="18" r="15.9155" stroke="#0066FF" stroke-dasharray="100" stroke-dashoffset="100"></circle>
                </svg>
                <div class="ring-content" id="prot-text">0g</div>
            </div>
            <div class="ring-label">Protéines</div>
        </div>

        <!-- Glucides -->
        <div class="ring-card">
            <div class="ring-wrapper">
                <svg viewBox="0 0 36 36">
                    <circle class="ring-bg" cx="18" cy="18" r="15.9155"></circle>
                    <circle class="ring-fill" id="carbs-circle" cx="18" cy="18" r="15.9155" stroke="#00E676" stroke-dasharray="100" stroke-dashoffset="100"></circle>
                </svg>
                <div class="ring-content" id="carbs-text">0g</div>
            </div>
            <div class="ring-label">Glucides</div>
        </div>

        <!-- Lipides -->
        <div class="ring-card">
            <div class="ring-wrapper">
                <svg viewBox="0 0 36 36">
                    <circle class="ring-bg" cx="18" cy="18" r="15.9155"></circle>
                    <circle class="ring-fill" id="fats-circle" cx="18" cy="18" r="15.9155" stroke="#FF3D00" stroke-dasharray="100" stroke-dashoffset="100"></circle>
                </svg>
                <div class="ring-content" id="fats-text">0g</div>
            </div>
            <div class="ring-label">Lipides</div>
        </div>
    </div>

    <!-- Bloc Calories -->
    <div class="whoop-card">
        <div>
            <div class="card-title">Calories consommées</div>
            <div class="card-value" id="cal-val">0 <span>kcal</span></div>
        </div>
    </div>

    <!-- Boutons d'action -->
    <button class="btn-scan" id="open-modal-btn">Ajouter un repas</button>
    <button class="btn-reset" id="clear-btn">Remettre à zéro</button>

    <!-- Modale de Saisie Interactive -->
    <div class="modal-overlay" id="meal-modal">
        <div class="modal-content">
            <div class="modal-title">Ajouter un apport nutritionnel</div>
            <div class="input-group">
                <label>Calories (kcal)</label>
                <input type="number" id="input-cal" placeholder="ex: 500">
            </div>
            <div class="input-group">
                <label>Protéines (g)</label>
                <input type="number" id="input-prot" placeholder="ex: 35">
            </div>
            <div class="input-group">
                <label>Glucides (g)</label>
                <input type="number" id="input-carbs" placeholder="ex: 50">
            </div>
            <div class="input-group">
                <label>Lipides (g)</label>
                <input type="number" id="input-fats" placeholder="ex: 15">
            </div>
            <div class="modal-actions">
                <button class="btn-modal-cancel" id="close-modal-btn">Annuler</button>
                <button class="btn-modal-save" id="save-meal-btn">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- Barre de navigation basse -->
    <nav>
        <a href="#" class="nav-item active">Accueil</a>
        <a href="#" class="nav-item">Macros</a>
        <a href="#" class="nav-item">Journal</a>
        <a href="#" class="nav-item">Profil</a>
    </nav>

    <script>
        // Cibles journalières
        const targets = { prot: 180, carbs: 250, fats: 70 };

        // État chargé depuis localStorage
        let data = JSON.parse(localStorage.getItem('fuel_engine_v3')) || {
            calories: 0,
            prot: 0,
            carbs: 0,
            fats: 0
        };

        const modal = document.getElementById('meal-modal');

        function updateUI() {
            document.getElementById('cal-val').innerHTML = `${data.calories.toLocaleString()} <span>kcal</span>`;

            document.getElementById('prot-text').innerText = `${data.prot}g`;
            document.getElementById('carbs-text').innerText = `${data.carbs}g`;
            document.getElementById('fats-text').innerText = `${data.fats}g`;

            // Calcul des pourcentages pour les anneaux circulaires (0 à 100)
            let protPct = Math.min(100, Math.round((data.prot / targets.prot) * 100));
            let carbsPct = Math.min(100, Math.round((data.carbs / targets.carbs) * 100));
            let fatsPct = Math.min(100, Math.round((data.fats / targets.fats) * 100));

            // En SVG, stroke-dashoffset va de 100 (vide) à 0 (plein)
            document.getElementById('prot-circle').style.strokeDashoffset = 100 - protPct;
            document.getElementById('carbs-circle').style.strokeDashoffset = 100 - carbsPct;
            document.getElementById('fats-circle').style.strokeDashoffset = 100 - fatsPct;

            localStorage.setItem('fuel_engine_v3', JSON.stringify(data));
        }

        // Ouverture / Fermeture de la modale
        document.getElementById('open-modal-btn').addEventListener('click', () => {
            modal.classList.add('active');
        });

        document.getElementById('close-modal-btn').addEventListener('click', () => {
            modal.classList.remove('active');
        });

        // Enregistrement d'un repas
        document.getElementById('save-meal-btn').addEventListener('click', () => {
            let cal = parseInt(document.getElementById('input-cal').value) || 0;
            let prot = parseInt(document.getElementById('input-prot').value) || 0;
            let carbs = parseInt(document.getElementById('input-carbs').value) || 0;
            let fats = parseInt(document.getElementById('input-fats').value) || 0;

            data.calories += cal;
            data.prot += prot;
            data.carbs += carbs;
            data.fats += fats;

            // Réinitialisation des inputs
            document.getElementById('input-cal').value = '';
            document.getElementById('input-prot').value = '';
            document.getElementById('input-carbs').value = '';
            document.getElementById('input-fats').value = '';

            modal.classList.remove('active');
            updateUI();
        });

        // Remise à zéro
        document.getElementById('clear-btn').addEventListener('click', () => {
            if(confirm("Remettre la journée à zéro ?")) {
                data = { calories: 0, prot: 0, carbs: 0, fats: 0 };
                updateUI();
            }
        });

        document.getElementById('reset-day').addEventListener('click', () => {
            if(confirm("Remettre la journée à zéro ?")) {
                data = { calories: 0, prot: 0, carbs: 0, fats: 0 };
                updateUI();
            }
        });

        updateUI();
    </script>
</body>
</html>
