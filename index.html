<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuel Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: space-between;
        }
        header {
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
            color: #8E8E93;
            font-weight: bold;
            padding-top: 10px;
        }
        .main-calories {
            margin-top: 20px;
        }
        .label {
            font-size: 11px;
            color: #8E8E93;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
        }
        .calories-value {
            font-size: 52px;
            font-weight: 800;
            color: #FFFFFF;
        }
        .macros-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .macro-card {
            background-color: #121212;
            border: 1px solid #1A1A1A;
            border-radius: 12px;
            padding: 14px;
        }
        .macro-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #8E8E93;
            letter-spacing: 1px;
        }
        .macro-value {
            color: #FFFFFF;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #1A1A1A;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 3px;
        }
        .btn-scan {
            width: 100%;
            background-color: #00E676;
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 18px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 230, 118, 0.3);
        }
    </style>
</head>
<body>

    <header>FUEL ENGINE</header>

    <div class="main-calories">
        <div class="label">CALORIES RESTANTES</div>
        <div class="calories-value">1,850</div>
    </div>

    <div class="macros-container">
        <!-- Protéines -->
        <div class="macro-card">
            <div class="macro-header">
                <span>PROTÉINES</span>
                <span class="macro-value">142 / 180 g</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 78%; background-color: #0055FF;"></div>
            </div>
        </div>
        <!-- Glucides -->
        <div class="macro-card">
            <div class="macro-header">
                <span>GLUCIDES</span>
                <span class="macro-value">210 / 250 g</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 84%; background-color: #00E676;"></div>
            </div>
        </div>
        <!-- Lipides -->
        <div class="macro-card">
            <div class="macro-header">
                <span>LIPIDES</span>
                <span class="macro-value">55 / 70 g</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" style="width: 75%; background-color: #FF3B30;"></div>
            </div>
        </div>
    </div>

    <button class="btn-scan" onclick="alert('Ouverture de la caméra et de l IA...')">SCANNER UN REPAS</button>

</body>
</html>
