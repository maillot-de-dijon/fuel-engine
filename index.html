<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuel Engine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000000;
            color: #FFFFFF;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        header {
            text-align: center;
            font-size: 11px;
            letter-spacing: 2px;
            color: #888888;
            text-transform: uppercase;
            padding-top: 10px;
        }
        .main-card {
            background-color: #0A0A0A;
            border: 1px solid #1A1A1A;
            border-radius: 16px;
            padding: 24px;
            margin: auto 0;
        }
        .calories-label {
            font-size: 11px;
            letter-spacing: 1.5px;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .calories-value {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }
        .macro-item {
            background-color: #121212;
            border: 1px solid #222222;
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }
        .macro-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #AAAAAA;
        }
        .macro-bar-bg {
            background-color: #222222;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }
        .macro-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.4s ease;
        }
        .fill-prot { background-color: #0066FF; }
        .fill-carbs { background-color: #00E676; }
        .fill-fats { background-color: #FF3D00; }
        
        .btn-scan {
            background-color: #00E676;
            color: #000000;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 230, 118, 0.2);
        }
    </style>
</head>
<body>
    <header>Fuel Engine</header>

    <div class="main-card">
        <div class="calories-label">Calories restantes</div>
        <div class="calories-value" id="cal-val">1,850</div>

        <div class="macro-item">
            <div class="macro-header">
                <span>Protéines</span>
                <span id="prot-text">142 / 180 g</span>
            </div>
            <div class="macro-bar-bg">
                <div class="macro-bar-fill fill-prot" id="prot-bar" style="width: 78%;"></div>
            </div>
        </div>

        <div class="macro-item">
            <div class="macro-header">
                <span>Glucides</span>
                <span id="carbs-text">210 / 250 g</span>
            </div>
            <div class="macro-bar-bg">
                <div class="macro-bar-fill fill-carbs" id="carbs-bar" style="width: 84%;"></div>
            </div>
        </div>

        <div class="macro-item">
            <div class="macro-header">
                <span>Lipides</span>
                <span id="fats-text">55 / 70 g</span>
            </div>
            <div class="macro-bar-bg">
                <div class="macro-bar-fill fill-fats" id="fats-bar" style="width: 78%;"></div>
            </div>
        </div>
    </div>

    <button class="btn-scan" id="scan-btn">Ajouter un repas</button>

    <script>
        // État de l'application (sauvegardé en localStorage)
        let data = JSON.parse(localStorage.getItem('fuel_data')) || {
            calories: 1850,
            prot: 142,
            carbs: 210,
            fats: 55
        };

        const targets = { prot: 180, carbs: 250, fats: 70, calMax: 2200 };

        function updateUI() {
            document.getElementById('cal-val').innerText = data.calories.toLocaleString();
            document.getElementById('prot-text').innerText = `${data.prot} / ${targets.prot} g`;
            document.getElementById('carbs-text').innerText = `${data.carbs} / ${targets.carbs} g`;
            document.getElementById('fats-text').innerText = `${data.fats} / ${targets.fats} g`;

            document.getElementById('prot-bar').style.width = Math.min(100, (data.prot / targets.prot) * 100) + '%';
            document.getElementById('carbs-bar').style.width = Math.min(100, (data.carbs / targets.carbs) * 100) + '%';
            document.getElementById('fats-bar').style.width = Math.min(100, (data.fats / targets.fats) * 100) + '%';

            localStorage.setItem('fuel_data', JSON.stringify(data));
        }

        document.getElementById('scan-btn').addEventListener('click', () => {
            let addedCal = prompt("Calories à ajouter :", "500");
            if (addedCal !== null) {
                data.calories -= parseInt(addedCal || 0);
                data.prot += 30; // Exemple d'ajout par défaut
                data.carbs += 40;
                data.fats += 15;
                updateUI();
            }
        });

        updateUI();
    </script>
</body>
</html>
